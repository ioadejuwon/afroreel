name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm --prefix mobile ci

      - name: Type-check server
        run: npm run type-check

      - name: Test server
        run: npm test

      - name: Type-check mobile app
        run: npm --prefix mobile run type-check

      - name: Lint mobile app
        run: npm --prefix mobile run lint

      - name: Validate Expo dependencies
        run: npm --prefix mobile run doctor

      - name: Build server
        run: npm run build
